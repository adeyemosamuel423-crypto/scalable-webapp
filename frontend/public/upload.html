<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload — StreamHive</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="brand"><span class="hex"></span> StreamHive</a>
  <div id="nav-actions" class="nav-links"></div>
</div>

<div class="container">
  <div class="section-title">Upload a video</div>

  <div class="auth-shell" style="margin:0 0 40px;max-width:560px;">
    <div id="msg"></div>
    <form id="upload-form">
      <div class="field">
        <label for="title">Title *</label>
        <input type="text" id="title" required>
      </div>
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description"></textarea>
      </div>
      <div class="field" style="display:flex;gap:12px;">
        <div style="flex:1;">
          <label for="publisher">Publisher</label>
          <input type="text" id="publisher">
        </div>
        <div style="flex:1;">
          <label for="producer">Producer</label>
          <input type="text" id="producer">
        </div>
      </div>
      <div class="field" style="display:flex;gap:12px;">
        <div style="flex:1;">
          <label for="genre">Genre</label>
          <select id="genre">
            <option>Comedy</option><option>Music</option><option>Education</option>
            <option>Gaming</option><option>Vlog</option><option>Sports</option>
            <option>Tech</option><option>Other</option>
          </select>
        </div>
        <div style="flex:1;">
          <label for="age_rating">Age rating</label>
          <select id="age_rating">
            <option>U</option><option selected>PG</option><option>12</option>
            <option>12A</option><option>15</option><option>18</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="video">Video file *</label>
        <input type="file" id="video" accept="video/mp4,video/webm,video/quicktime,video/x-matroska" required>
      </div>
      <button class="btn-block" type="submit" id="submit-btn">Upload</button>
    </form>
  </div>

  <div class="section-title">Your uploads</div>
  <div class="grid" id="my-videos"></div>
</div>

<script src="js/api.js"></script>
<script src="js/upload.js"></script>
</body>
</html>
