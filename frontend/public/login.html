<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — StreamHive</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="brand"><span class="hex"></span> StreamHive</a>
  <div id="nav-actions" class="nav-links"></div>
</div>

<div class="auth-shell">
  <h1>Welcome back</h1>
  <div class="sub">Log in as a creator or a consumer.</div>
  <div id="msg"></div>

  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required>
    </div>
    <button class="btn-block" type="submit">Log in</button>
  </form>

  <div class="switch-link">No account yet? <a href="signup.html">Sign up as a consumer</a></div>
  <div class="switch-link" style="margin-top:8px;font-size:0.78rem;">
    Demo creator login: <code>creator@streamhive.local</code> / <code>CreatorPass123!</code>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
