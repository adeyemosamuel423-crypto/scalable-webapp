<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — StreamHive</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="brand"><span class="hex"></span> StreamHive</a>
  <div id="nav-actions" class="nav-links"></div>
</div>

<div class="auth-shell">
  <h1>Join StreamHive</h1>
  <div class="sub">Consumer accounts can watch, comment and rate videos. Creator accounts are provisioned separately.</div>
  <div id="msg"></div>

  <form id="signup-form">
    <div class="field">
      <label for="display_name">Display name</label>
      <input type="text" id="display_name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>
    </div>
    <button class="btn-block" type="submit">Create account</button>
  </form>

  <div class="switch-link">Already have an account? <a href="login.html">Log in</a></div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
