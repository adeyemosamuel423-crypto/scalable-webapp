# ============================================================
# StreamHive - Azure DevOps CI/CD Deployment
# ============================================================

trigger:
  - main


# ============================================================
# AGENT
# ============================================================

pool:
  vmImage: 'ubuntu-latest'


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Azure DevOps Service Connection
  azureServiceConnection: 'streamhive-azure'

  # Azure Resource Group
  resourceGroup: 'rg-streamhive'

  # Azure Container Registry
  containerRegistry: 'streamhiveregistry2026'

  # Azure Container Apps
  backendApp: 'streamhive-api'
  frontendApp: 'streamhive-web'


# ============================================================
# DEPLOYMENT
# ============================================================

steps:

# ------------------------------------------------------------
# 1. Checkout source code
# ------------------------------------------------------------

- checkout: self
  displayName: 'Checkout StreamHive source code'


# ------------------------------------------------------------
# 2. Azure login
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Login to Azure'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      echo "=============================================="
      echo "Azure Login"
      echo "=============================================="

      az account show --output table

      echo "Azure login successful."


# ------------------------------------------------------------
# 3. Build and Push Backend Docker Image
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Build and Push Backend Docker Image'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      ACR_NAME="$(containerRegistry)"
      IMAGE_NAME="streamhive-backend"
      FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}"

      echo "=============================================="
      echo "Building StreamHive Backend"
      echo "=============================================="

      echo "Registry:"
      echo "${ACR_NAME}.azurecr.io"

      echo "Image:"
      echo "${FULL_IMAGE}"

      echo ""
      echo "Logging into Azure Container Registry..."

      az acr login \
        --name "${ACR_NAME}"

      echo ""
      echo "Building backend Docker image..."

      docker build \
        --tag "${FULL_IMAGE}" \
        --file backend/Dockerfile \
        .

      echo ""
      echo "Pushing backend Docker image..."

      docker push "${FULL_IMAGE}"

      echo ""
      echo "=============================================="
      echo "Backend image pushed successfully"
      echo "=============================================="


# ------------------------------------------------------------
# 4. Build and Push Frontend Docker Image
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Build and Push Frontend Docker Image'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      ACR_NAME="$(containerRegistry)"
      IMAGE_NAME="streamhive-frontend"
      FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}"

      echo "=============================================="
      echo "Building StreamHive Frontend"
      echo "=============================================="

      echo "Registry:"
      echo "${ACR_NAME}.azurecr.io"

      echo "Image:"
      echo "${FULL_IMAGE}"

      echo ""
      echo "Logging into Azure Container Registry..."

      az acr login \
        --name "${ACR_NAME}"

      echo ""
      echo "Building frontend Docker image..."

      docker build \
        --tag "${FULL_IMAGE}" \
        --file frontend/Dockerfile \
        .

      echo ""
      echo "Pushing frontend Docker image..."

      docker push "${FULL_IMAGE}"

      echo ""
      echo "=============================================="
      echo "Frontend image pushed successfully"
      echo "=============================================="


# ------------------------------------------------------------
# 5. Verify Images in Azure Container Registry
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Verify Images in Azure Container Registry'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      echo "=============================================="
      echo "Azure Container Registry Images"
      echo "=============================================="

      az acr repository list \
        --name "$(containerRegistry)" \
        --output table


# ------------------------------------------------------------
# 6. Deploy Backend Container
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Deploy Backend Container'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      IMAGE="$(containerRegistry).azurecr.io/streamhive-backend:${TAG}"

      echo "=============================================="
      echo "Deploying StreamHive Backend"
      echo "=============================================="

      echo "Container App:"
      echo "$(backendApp)"

      echo "Image:"
      echo "${IMAGE}"

      az containerapp update \
        --name "$(backendApp)" \
        --resource-group "$(resourceGroup)" \
        --image "${IMAGE}" \
        --revision-suffix "build-${TAG}"

      echo ""
      echo "Backend deployment completed."


# ------------------------------------------------------------
# 7. Deploy Frontend Container
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Deploy Frontend Container'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      IMAGE="$(containerRegistry).azurecr.io/streamhive-frontend:${TAG}"

      echo "=============================================="
      echo "Deploying StreamHive Frontend"
      echo "=============================================="

      echo "Container App:"
      echo "$(frontendApp)"

      echo "Image:"
      echo "${IMAGE}"

      az containerapp update \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --image "${IMAGE}" \
        --revision-suffix "build-${TAG}"

      echo ""
      echo "Frontend deployment completed."


# ------------------------------------------------------------
# 8. Wait for Deployment
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Wait for Azure Deployment'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      echo "=============================================="
      echo "Waiting for Container Apps"
      echo "=============================================="

      sleep 30

      echo "Deployment wait completed."


# ------------------------------------------------------------
# 9. Get Backend URL
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Get Backend URL'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      BACKEND_FQDN=$(az containerapp show \
        --name "$(backendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo ""
      echo "=============================================="
      echo "Backend URL"
      echo "=============================================="

      echo "https://${BACKEND_FQDN}"

      echo "##vso[task.setvariable variable=BACKEND_FQDN]${BACKEND_FQDN}"


# ------------------------------------------------------------
# 10. Get Frontend URL
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Get Frontend URL'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      FRONTEND_FQDN=$(az containerapp show \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo ""
      echo "=============================================="
      echo "StreamHive Application URL"
      echo "=============================================="

      echo "https://${FRONTEND_FQDN}"

      echo "##vso[task.setvariable variable=FRONTEND_FQDN]${FRONTEND_FQDN}"


# ------------------------------------------------------------
# 11. Test Backend Health
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Test Backend Health'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      BACKEND_FQDN=$(az containerapp show \
        --name "$(backendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo ""
      echo "=============================================="
      echo "Testing Backend Health"
      echo "=============================================="

      curl \
        --fail \
        --retry 10 \
        --retry-delay 5 \
        --max-time 30 \
        "https://${BACKEND_FQDN}/api/health"

      echo ""
      echo "Backend health check successful."


# ------------------------------------------------------------
# 12. Test Frontend
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Test Frontend'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      FRONTEND_FQDN=$(az containerapp show \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo ""
      echo "=============================================="
      echo "Testing Frontend"
      echo "=============================================="

      curl \
        --fail \
        --retry 10 \
        --retry-delay 5 \
        --max-time 30 \
        "https://${FRONTEND_FQDN}"

      echo ""
      echo "Frontend health check successful."


# ------------------------------------------------------------
# 13. Deployment Summary
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Deployment Summary'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      BACKEND_FQDN=$(az containerapp show \
        --name "$(backendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      FRONTEND_FQDN=$(az containerapp show \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo ""
      echo "================================================"
      echo "       STREAMHIVE DEPLOYMENT SUCCESSFUL"
      echo "================================================"

      echo ""
      echo "Build:"
      echo "${TAG}"

      echo ""
      echo "Backend:"
      echo "https://${BACKEND_FQDN}"

      echo ""
      echo "Frontend:"
      echo "https://${FRONTEND_FQDN}"

      echo ""
      echo "Backend Docker Image:"
      echo "$(containerRegistry).azurecr.io/streamhive-backend:${TAG}"

      echo ""
      echo "Frontend Docker Image:"
      echo "$(containerRegistry).azurecr.io/streamhive-frontend:${TAG}"

      echo ""
      echo "================================================"