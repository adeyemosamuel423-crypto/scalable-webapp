# ============================================================
# StreamHive - Azure DevOps CI/CD Pipeline
# ============================================================

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:

  # Azure DevOps service connection
  azureServiceConnection: 'streamhive-azure'

  # Azure resources
  resourceGroup: 'rg-streamhive'

  # Azure Container Registry
  containerRegistry: 'streamhiveregistry2026'

  # Azure Container Apps
  backendApp: 'streamhive-api'
  frontendApp: 'streamhive-web'


steps:

# ============================================================
# 1. CHECKOUT
# ============================================================

- checkout: self
  displayName: 'Checkout StreamHive source code'


# ============================================================
# 2. BUILD AND PUSH BACKEND
# ============================================================

- task: AzureCLI@2
  displayName: 'Build and Push Backend Docker Image'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      ACR_NAME="$(containerRegistry)"
      IMAGE_NAME="streamhive-backend"
      FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}"

      echo "=============================================="
      echo "Building StreamHive Backend"
      echo "=============================================="

      echo "Registry:"
      echo "${ACR_NAME}.azurecr.io"

      echo "Image:"
      echo "${FULL_IMAGE}"

      echo ""
      echo "Logging into Azure Container Registry..."

      az acr login \
        --name "${ACR_NAME}"

      echo ""
      echo "Building backend Docker image..."

      # IMPORTANT:
      # ./backend is the Docker build context.
      # This allows COPY package.json ./ to find:
      # backend/package.json

      docker build \
        --tag "${FULL_IMAGE}" \
        --file backend/Dockerfile \
        ./backend

      echo ""
      echo "Pushing backend Docker image..."

      docker push "${FULL_IMAGE}"

      echo ""
      echo "=============================================="
      echo "Backend image pushed successfully"
      echo "=============================================="


# ============================================================
# 3. BUILD AND PUSH FRONTEND
# ============================================================

- task: AzureCLI@2
  displayName: 'Build and Push Frontend Docker Image'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      ACR_NAME="$(containerRegistry)"
      IMAGE_NAME="streamhive-frontend"
      FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}"

      echo "=============================================="
      echo "Building StreamHive Frontend"
      echo "=============================================="

      echo "Registry:"
      echo "${ACR_NAME}.azurecr.io"

      echo "Image:"
      echo "${FULL_IMAGE}"

      echo ""
      echo "Logging into Azure Container Registry..."

      az acr login \
        --name "${ACR_NAME}"

      echo ""
      echo "Building frontend Docker image..."

      # IMPORTANT:
      # ./frontend is the Docker build context.
      # Therefore nginx.conf.template, nginx.conf,
      # public/, etc. are resolved from frontend/.

      docker build \
        --tag "${FULL_IMAGE}" \
        --file frontend/Dockerfile \
        ./frontend

      echo ""
      echo "Pushing frontend Docker image..."

      docker push "${FULL_IMAGE}"

      echo ""
      echo "=============================================="
      echo "Frontend image pushed successfully"
      echo "=============================================="


# ============================================================
# 4. DEPLOY BACKEND CONTAINER APP
# ============================================================

- task: AzureCLI@2
  displayName: 'Deploy Backend Container App'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      IMAGE="$(containerRegistry).azurecr.io/streamhive-backend:${TAG}"

      echo "=============================================="
      echo "Deploying StreamHive Backend"
      echo "=============================================="

      echo "Container App:"
      echo "$(backendApp)"

      echo "Image:"
      echo "${IMAGE}"

      az containerapp update \
        --name "$(backendApp)" \
        --resource-group "$(resourceGroup)" \
        --image "${IMAGE}" \
        --revision-suffix "build-${TAG}"

      echo ""
      echo "Backend deployment completed."


# ============================================================
# 5. DEPLOY FRONTEND CONTAINER APP
# ============================================================

- task: AzureCLI@2
  displayName: 'Deploy Frontend Container App'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      IMAGE="$(containerRegistry).azurecr.io/streamhive-frontend:${TAG}"

      echo "=============================================="
      echo "Deploying StreamHive Frontend"
      echo "=============================================="

      echo "Container App:"
      echo "$(frontendApp)"

      echo "Image:"
      echo "${IMAGE}"

      az containerapp update \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --image "${IMAGE}" \
        --revision-suffix "build-${TAG}"

      echo ""
      echo "Frontend deployment completed."


# ============================================================
# 6. GET APPLICATION URL
# ============================================================

- task: AzureCLI@2
  displayName: 'Get StreamHive Application URL'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      echo "=============================================="
      echo "StreamHive Application"
      echo "=============================================="

      FRONTEND_FQDN=$(az containerapp show \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo ""
      echo "Application URL:"
      echo "https://${FRONTEND_FQDN}"

      echo ""
      echo "=============================================="
      echo "DEPLOYMENT COMPLETED"
      echo "=============================================="