# ============================================================
# StreamHive - Azure DevOps CI/CD Deployment
# ============================================================

trigger:
- main

# ============================================================
# AGENT
# ============================================================

pool:
  vmImage: ubuntu-latest

# ============================================================
# VARIABLES
# ============================================================

variables:

  # Azure DevOps Service Connection
  azureServiceConnection: 'streamhive-azure'

  # Azure Resource Group
  resourceGroup: 'rg-streamhive'

  # Azure Container Registry
  containerRegistry: 'streamhiveregistry2026'

  # Azure Container Apps
  backendApp: 'streamhive-api'
  frontendApp: 'streamhive-web'

# ============================================================
# DEPLOYMENT
# ============================================================

steps:

# ------------------------------------------------------------
# 1. Checkout source code
# ------------------------------------------------------------

- checkout: self
  displayName: 'Checkout StreamHive source code'


# ------------------------------------------------------------
# 2. Azure login
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Login to Azure'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      echo "=============================================="
      echo "Azure Login Successful"
      echo "=============================================="

      az account show --output table


# ------------------------------------------------------------
# 3. Build Backend Docker Image
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Build Backend Docker Image'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      echo "=============================================="
      echo "Building StreamHive Backend"
      echo "=============================================="

      echo "Image:"
      echo "$(containerRegistry).azurecr.io/streamhive-backend:${TAG}"

      az acr build \
        --registry "$(containerRegistry)" \
        --image "streamhive-backend:${TAG}" \
        --file backend/Dockerfile \
        .

      echo "Backend image built successfully."


# ------------------------------------------------------------
# 4. Build Frontend Docker Image
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Build Frontend Docker Image'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      echo "=============================================="
      echo "Building StreamHive Frontend"
      echo "=============================================="

      echo "Image:"
      echo "$(containerRegistry).azurecr.io/streamhive-frontend:${TAG}"

      az acr build \
        --registry "$(containerRegistry)" \
        --image "streamhive-frontend:${TAG}" \
        --file frontend/Dockerfile \
        .

      echo "Frontend image built successfully."


# ------------------------------------------------------------
# 5. Show Images
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Verify Images in Azure Container Registry'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      echo "=============================================="
      echo "Azure Container Registry Images"
      echo "=============================================="

      az acr repository list \
        --name "$(containerRegistry)" \
        --output table


# ------------------------------------------------------------
# 6. Deploy Backend Container
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Deploy Backend Container'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      echo "=============================================="
      echo "Deploying StreamHive Backend"
      echo "=============================================="

      az containerapp update \
        --name "$(backendApp)" \
        --resource-group "$(resourceGroup)" \
        --image "$(containerRegistry).azurecr.io/streamhive-backend:${TAG}" \
        --revision-suffix "build-${TAG}"

      echo "Backend deployment completed."


# ------------------------------------------------------------
# 7. Get Backend URL
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Get Backend URL'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      BACKEND_FQDN=$(az containerapp show \
        --name "$(backendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo "=============================================="
      echo "Backend URL"
      echo "=============================================="

      echo "https://${BACKEND_FQDN}"

      echo "##vso[task.setvariable variable=BACKEND_FQDN]${BACKEND_FQDN}"


# ------------------------------------------------------------
# 8. Deploy Frontend Container
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Deploy Frontend Container'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      echo "=============================================="
      echo "Deploying StreamHive Frontend"
      echo "=============================================="

      az containerapp update \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --image "$(containerRegistry).azurecr.io/streamhive-frontend:${TAG}" \
        --revision-suffix "build-${TAG}"

      echo "Frontend deployment completed."


# ------------------------------------------------------------
# 9. Wait for deployment
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Wait for Azure Deployment'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      echo "Waiting for Container Apps to become available..."

      sleep 30


# ------------------------------------------------------------
# 10. Get Frontend URL
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Get Frontend URL'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      FRONTEND_FQDN=$(az containerapp show \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo "=============================================="
      echo "StreamHive Application URL"
      echo "=============================================="

      echo "https://${FRONTEND_FQDN}"

      echo "##vso[task.setvariable variable=FRONTEND_FQDN]${FRONTEND_FQDN}"


# ------------------------------------------------------------
# 11. Test Backend Health
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Test Backend Health'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      BACKEND_FQDN=$(az containerapp show \
        --name "$(backendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo "=============================================="
      echo "Testing Backend Health"
      echo "=============================================="

      curl \
        --fail \
        --retry 5 \
        --retry-delay 5 \
        "https://${BACKEND_FQDN}/api/health"

      echo ""
      echo "Backend health check successful."


# ------------------------------------------------------------
# 12. Test Frontend
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Test Frontend'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      FRONTEND_FQDN=$(az containerapp show \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo "=============================================="
      echo "Testing Frontend"
      echo "=============================================="

      curl \
        --fail \
        --retry 5 \
        --retry-delay 5 \
        "https://${FRONTEND_FQDN}"

      echo ""
      echo "Frontend health check successful."


# ------------------------------------------------------------
# 13. Deployment Summary
# ------------------------------------------------------------

- task: AzureCLI@2
  displayName: 'Deployment Summary'

  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'

    inlineScript: |

      TAG="$(Build.BuildId)"

      BACKEND_FQDN=$(az containerapp show \
        --name "$(backendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      FRONTEND_FQDN=$(az containerapp show \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)

      echo ""
      echo "================================================"
      echo "       STREAMHIVE DEPLOYMENT SUCCESSFUL"
      echo "================================================"

      echo ""
      echo "Build:"
      echo "${TAG}"

      echo ""
      echo "Backend:"
      echo "https://${BACKEND_FQDN}"

      echo ""
      echo "Frontend:"
      echo "https://${FRONTEND_FQDN}"

      echo ""
      echo "Backend Docker Image:"
      echo "$(containerRegistry).azurecr.io/streamhive-backend:${TAG}"

      echo ""
      echo "Frontend Docker Image:"
      echo "$(containerRegistry).azurecr.io/streamhive-frontend:${TAG}"

      echo ""
      echo "================================================"