# ============================================================
# StreamHive - Azure DevOps CI/CD Pipeline
# ============================================================

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Azure DevOps service connection
  azureServiceConnection: 'streamhive-azure'

  # Azure Resource Group
  resourceGroup: 'rg-streamhive'

  # Azure Container Registry
  containerRegistry: 'streamhiveregistry2026'

  # Azure Container Apps Environment
  containerAppEnvironment: 'streamhive-env'

  # Azure Container Apps
  backendApp: 'streamhive-api'
  frontendApp: 'streamhive-web'

  # Azure region allowed by your subscription policy
  location: 'spaincentral'


# ============================================================
# STEPS
# ============================================================

steps:


# ============================================================
# 1. CHECKOUT SOURCE CODE
# ============================================================

- checkout: self
  displayName: 'Checkout StreamHive source code'


# ============================================================
# 2. BUILD AND PUSH BACKEND DOCKER IMAGE
# ============================================================

- task: AzureCLI@2
  displayName: 'Build and Push Backend Docker Image'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      ACR_NAME="$(containerRegistry)"

      IMAGE_NAME="streamhive-backend"

      FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}"


      echo "=============================================="
      echo "Building StreamHive Backend"
      echo "=============================================="

      echo "Registry:"
      echo "${ACR_NAME}.azurecr.io"

      echo "Image:"
      echo "${FULL_IMAGE}"


      # --------------------------------------------------------
      # Login to Azure Container Registry
      # --------------------------------------------------------

      echo ""
      echo "Logging into Azure Container Registry..."

      az acr login \
        --name "${ACR_NAME}"


      # --------------------------------------------------------
      # Build backend
      # --------------------------------------------------------
      #
      # ./backend is the Docker build context.
      #
      # Therefore:
      #
      # backend/package.json
      #
      # is available to:
      #
      # COPY package.json ./
      #
      # inside backend/Dockerfile.
      # --------------------------------------------------------

      echo ""
      echo "Building backend Docker image..."

      docker build \
        --tag "${FULL_IMAGE}" \
        --file backend/Dockerfile \
        ./backend


      # --------------------------------------------------------
      # Push backend image
      # --------------------------------------------------------

      echo ""
      echo "Pushing backend Docker image..."

      docker push "${FULL_IMAGE}"


      echo ""
      echo "=============================================="
      echo "Backend image pushed successfully"
      echo "=============================================="

      echo "Image:"
      echo "${FULL_IMAGE}"


# ============================================================
# 3. BUILD AND PUSH FRONTEND DOCKER IMAGE
# ============================================================

- task: AzureCLI@2
  displayName: 'Build and Push Frontend Docker Image'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      TAG="$(Build.BuildId)"

      ACR_NAME="$(containerRegistry)"

      IMAGE_NAME="streamhive-frontend"

      FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}"


      echo "=============================================="
      echo "Building StreamHive Frontend"
      echo "=============================================="

      echo "Registry:"
      echo "${ACR_NAME}.azurecr.io"

      echo "Image:"
      echo "${FULL_IMAGE}"


      # --------------------------------------------------------
      # Login to Azure Container Registry
      # --------------------------------------------------------

      echo ""
      echo "Logging into Azure Container Registry..."

      az acr login \
        --name "${ACR_NAME}"


      # --------------------------------------------------------
      # Build frontend
      # --------------------------------------------------------

      echo ""
      echo "Building frontend Docker image..."

      docker build \
        --tag "${FULL_IMAGE}" \
        --file frontend/Dockerfile \
        ./frontend


      # --------------------------------------------------------
      # Push frontend image
      # --------------------------------------------------------

      echo ""
      echo "Pushing frontend Docker image..."

      docker push "${FULL_IMAGE}"


      echo ""
      echo "=============================================="
      echo "Frontend image pushed successfully"
      echo "=============================================="

      echo "Image:"
      echo "${FULL_IMAGE}"


# ============================================================
# 4. ENABLE ACR ADMIN ACCESS
#
# Required because the Container Apps need registry credentials
# when creating a new Container App from a private ACR image.
# ============================================================

- task: AzureCLI@2
  displayName: 'Enable ACR Admin Access'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e

      ACR_NAME="$(containerRegistry)"


      echo "=============================================="
      echo "Enabling ACR Admin Access"
      echo "=============================================="

      echo "Registry:"
      echo "${ACR_NAME}.azurecr.io"


      # Enable ACR administrator credentials.
      #
      # This allows the pipeline to retrieve:
      #   - ACR username
      #   - ACR password
      #
      # These credentials are supplied to Azure Container Apps
      # when a new Container App is created.

      az acr update \
        --name "${ACR_NAME}" \
        --admin-enabled true


      echo ""
      echo "ACR admin access enabled successfully."


# ============================================================
# 5. CREATE AZURE CONTAINER APPS ENVIRONMENT
#    IF IT DOES NOT EXIST
# ============================================================

- task: AzureCLI@2
  displayName: 'Create Container Apps Environment'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e


      echo "=============================================="
      echo "Checking Container Apps Environment"
      echo "=============================================="


      if az containerapp env show \
        --name "$(containerAppEnvironment)" \
        --resource-group "$(resourceGroup)" \
        >/dev/null 2>&1
      then

        echo ""
        echo "Container Apps environment already exists."

        echo "Environment:"
        echo "$(containerAppEnvironment)"

      else

        echo ""
        echo "Container Apps environment does not exist."

        echo "Creating environment..."


        az containerapp env create \
          --name "$(containerAppEnvironment)" \
          --resource-group "$(resourceGroup)" \
          --location "$(location)"


        echo ""
        echo "Container Apps environment created."

      fi


# ============================================================
# 6. DEPLOY BACKEND CONTAINER APP
#    CREATE IF MISSING / UPDATE IF EXISTING
# ============================================================

- task: AzureCLI@2
  displayName: 'Deploy Backend Container App'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e


      TAG="$(Build.BuildId)"

      RESOURCE_GROUP="$(resourceGroup)"

      APP_NAME="$(backendApp)"

      ENVIRONMENT="$(containerAppEnvironment)"

      ACR_NAME="$(containerRegistry)"

      IMAGE="${ACR_NAME}.azurecr.io/streamhive-backend:${TAG}"


      echo "=============================================="
      echo "Deploying StreamHive Backend"
      echo "=============================================="

      echo "Resource Group:"
      echo "${RESOURCE_GROUP}"

      echo "Container App:"
      echo "${APP_NAME}"

      echo "Environment:"
      echo "${ENVIRONMENT}"

      echo "Image:"
      echo "${IMAGE}"


      # --------------------------------------------------------
      # Get ACR credentials
      # --------------------------------------------------------

      echo ""
      echo "Getting Azure Container Registry credentials..."


      ACR_USERNAME=$(az acr credential show \
        --name "${ACR_NAME}" \
        --query "username" \
        --output tsv)


      ACR_PASSWORD=$(az acr credential show \
        --name "${ACR_NAME}" \
        --query "passwords[0].value" \
        --output tsv)


      if [ -z "${ACR_USERNAME}" ] || [ -z "${ACR_PASSWORD}" ]; then
        echo "ERROR: Unable to retrieve ACR credentials."
        exit 1
      fi


      echo "ACR credentials retrieved successfully."


      # --------------------------------------------------------
      # Check whether backend Container App exists
      # --------------------------------------------------------

      if az containerapp show \
        --name "${APP_NAME}" \
        --resource-group "${RESOURCE_GROUP}" \
        >/dev/null 2>&1
      then

        echo ""
        echo "Backend Container App already exists."

        echo "Updating backend image..."


        az containerapp update \
          --name "${APP_NAME}" \
          --resource-group "${RESOURCE_GROUP}" \
          --image "${IMAGE}" \
          --revision-suffix "build-${TAG}"


        echo ""
        echo "Backend Container App updated."

      else

        echo ""
        echo "Backend Container App does not exist."

        echo "Creating backend Container App..."


        az containerapp create \
          --name "${APP_NAME}" \
          --resource-group "${RESOURCE_GROUP}" \
          --environment "${ENVIRONMENT}" \
          --image "${IMAGE}" \
          --target-port 5000 \
          --ingress external \
          --registry-server "${ACR_NAME}.azurecr.io" \
          --registry-username "${ACR_USERNAME}" \
          --registry-password "${ACR_PASSWORD}" \
          --min-replicas 1 \
          --max-replicas 1


        echo ""
        echo "Backend Container App created."

      fi


      echo ""
      echo "=============================================="
      echo "Backend deployment completed"
      echo "=============================================="


# ============================================================
# 7. DEPLOY FRONTEND CONTAINER APP
#    CREATE IF MISSING / UPDATE IF EXISTING
# ============================================================

- task: AzureCLI@2
  displayName: 'Deploy Frontend Container App'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e


      TAG="$(Build.BuildId)"

      RESOURCE_GROUP="$(resourceGroup)"

      APP_NAME="$(frontendApp)"

      ENVIRONMENT="$(containerAppEnvironment)"

      ACR_NAME="$(containerRegistry)"

      IMAGE="${ACR_NAME}.azurecr.io/streamhive-frontend:${TAG}"


      echo "=============================================="
      echo "Deploying StreamHive Frontend"
      echo "=============================================="

      echo "Resource Group:"
      echo "${RESOURCE_GROUP}"

      echo "Container App:"
      echo "${APP_NAME}"

      echo "Environment:"
      echo "${ENVIRONMENT}"

      echo "Image:"
      echo "${IMAGE}"


      # --------------------------------------------------------
      # Get ACR credentials
      # --------------------------------------------------------

      echo ""
      echo "Getting Azure Container Registry credentials..."


      ACR_USERNAME=$(az acr credential show \
        --name "${ACR_NAME}" \
        --query "username" \
        --output tsv)


      ACR_PASSWORD=$(az acr credential show \
        --name "${ACR_NAME}" \
        --query "passwords[0].value" \
        --output tsv)


      if [ -z "${ACR_USERNAME}" ] || [ -z "${ACR_PASSWORD}" ]; then
        echo "ERROR: Unable to retrieve ACR credentials."
        exit 1
      fi


      echo "ACR credentials retrieved successfully."


      # --------------------------------------------------------
      # Check whether frontend Container App exists
      # --------------------------------------------------------

      if az containerapp show \
        --name "${APP_NAME}" \
        --resource-group "${RESOURCE_GROUP}" \
        >/dev/null 2>&1
      then

        echo ""
        echo "Frontend Container App already exists."

        echo "Updating frontend image..."


        az containerapp update \
          --name "${APP_NAME}" \
          --resource-group "${RESOURCE_GROUP}" \
          --image "${IMAGE}" \
          --revision-suffix "build-${TAG}"


        echo ""
        echo "Frontend Container App updated."

      else

        echo ""
        echo "Frontend Container App does not exist."

        echo "Creating frontend Container App..."


        az containerapp create \
          --name "${APP_NAME}" \
          --resource-group "${RESOURCE_GROUP}" \
          --environment "${ENVIRONMENT}" \
          --image "${IMAGE}" \
          --target-port 80 \
          --ingress external \
          --registry-server "${ACR_NAME}.azurecr.io" \
          --registry-username "${ACR_USERNAME}" \
          --registry-password "${ACR_PASSWORD}" \
          --min-replicas 1 \
          --max-replicas 1


        echo ""
        echo "Frontend Container App created."

      fi


      echo ""
      echo "=============================================="
      echo "Frontend deployment completed"
      echo "=============================================="


# ============================================================
# 8. GET FRONTEND APPLICATION URL
# ============================================================

- task: AzureCLI@2
  displayName: 'Get StreamHive Application URL'

  inputs:

    azureSubscription: '$(azureServiceConnection)'

    scriptType: 'bash'

    scriptLocation: 'inlineScript'

    inlineScript: |

      set -e


      echo "=============================================="
      echo "StreamHive Application"
      echo "=============================================="


      FRONTEND_FQDN=$(az containerapp show \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --query "properties.configuration.ingress.fqdn" \
        --output tsv)


      if [ -z "${FRONTEND_FQDN}" ]; then
        echo "ERROR: Could not retrieve frontend Container App URL."
        exit 1
      fi


      echo ""
      echo "=============================================="
      echo "APPLICATION URL"
      echo "=============================================="

      echo "https://${FRONTEND_FQDN}"


      echo ""
      echo "=============================================="
      echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
      echo "=============================================="